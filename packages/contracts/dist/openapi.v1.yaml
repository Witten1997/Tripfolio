  /geo/routes:
    get:
      tags:
        - geo
      operationId: calculateRoute
      summary: 计算两点间的道路距离、预计时长和路线
      description: 驾车、步行、骑行使用高德路径规划 2.0；成功结果按有序坐标和模式缓存 5 分钟，无路线返回 404。按 Key 平滑请求；短时限流 429 和可恢复的 503 带 Retry-After，未配置或配额不足的 503 不自动重试。
      parameters:
        - name: origin_latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: origin_longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: destination_latitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -90
            maximum: 90
        - name: destination_longitude
          in: query
          required: true
          schema:
            type: number
            format: double
            minimum: -180
            maximum: 180
        - name: mode
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/GeoTravelMode'
      responses:
        '200':
          description: 首选路线；距离为米，时长为秒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRouteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /geo/trip-routes:
    get:
      tags:
        - geo
      operationId: calculateTripRoutes
      summary: 一次算出整趟行程的相邻路段
      description: |
        按传入的有序坐标返回相邻路段（长度为坐标数减一），语义与逐段调用 calculateRoute 一致。
        驾车使用高德路径规划 2.0 的途经点能力：每 16 段（17 个坐标）合并为一次上游请求，
        单次返回的整条路线按步骤归属切回各段，因此等待时间与段数基本无关；步行与骑行逐段计算。
        任一段无路线或上游失败时整体失败，调用方退回逐段调用，每段仍可单独降级。
        成功路段按有序坐标与模式缓存 5 分钟，命中缓存的段不发起上游请求。
      parameters:
        - name: points
          in: query
          required: true
          description: 有序坐标，格式为 `经度,纬度;经度,纬度`，最多 50 个点
          schema:
            type: string
            minLength: 3
            maxLength: 2000
        - name: mode
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/GeoTravelMode'
      responses:
        '200':
          description: 相邻路段；距离为米，时长为秒
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRouteListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /metadata:
    get:
      tags:
        - metadata
      operationId: getMetadata
      summary: 公开固定枚举、币种精度、上传上限与协议版本
      description: |
        不需要身份。客户端不能自行添加服务端未支持的枚举值；币种小数位用于金额规范化与校验。
        返回值随程序版本变化，不随用户数据变化，可缓存到下次启动。
      security: []
      responses:
        '200':
          description: 当前服务端的元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/email-challenges:
    post:
      tags:
        - auth
      operationId: requestEmailChallenge
      summary: 申请注册或找回密码的邮箱验证码
      description: 统一响应，不暴露账号是否存在；每邮箱 60 秒一次、每小时 5 次，并按 IP 限流；邮件服务未启用时返回 503 DEPENDENCY_UNAVAILABLE
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChallengeRequest'
      responses:
        '202':
          description: 已受理（验证码通过邮件投递）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChallengeResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /auth/register:
    post:
      tags:
        - auth
      operationId: registerAccount
      summary: 验证邮箱后创建账号并登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 账号已创建并开启会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: 邮箱密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags:
        - auth
      operationId: refreshSession
      summary: 轮换刷新令牌并签发新的访问令牌
      description: 网页端凭 Cookie 与 X-CSRF-Token；原生端在正文提供 refresh_token。60 秒宽限期内用前次令牌重试视为响应丢失
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 新令牌对
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: 撤销当前会话并清除浏览器刷新 Cookie
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password-reset:
    post:
      tags:
        - auth
      operationId: resetPassword
      summary: 验证码验证后重置密码并撤销全部会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 已重置（账号不存在时同样返回）
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/reauthenticate:
    post:
      tags:
        - auth
      operationId: reauthenticate
      summary: 验证当前密码，本会话近期认证有效 5 分钟
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateRequest'
      responses:
        '204':
          description: 已验证
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account:
    get:
      tags:
        - account
      operationId: getAccount
      summary: 本人资料
      responses:
        '200':
          description: 资料，带 ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - account
      operationId: updateAccount
      summary: 修改昵称、头像或默认时区
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
  /account/password:
    post:
      tags:
        - account
      operationId: changePassword
      summary: 登录态修改密码；撤销其他会话，保留当前会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 已修改
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /account/sessions:
    get:
      tags:
        - account
      operationId: listSessions
      summary: 本人有效会话
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account/sessions/{session_id}:
    delete:
      tags:
        - account
      operationId: revokeSession
      summary: 撤销本人指定会话；重复撤销仍成功
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已撤销
        '401':
          $ref: '#/components/responses/Unauthorized'
  /expense-categories:
    get:
      tags:
        - finance
      operationId: listExpenseCategories
      summary: 本账号全部有效账单分类
      responses:
        '200':
          description: 按 sort_order、id 排序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategoryListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - finance
      operationId: createExpenseCategory
      summary: 新建账单分类
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCategoryCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /expense-categories/{category_id}:
    parameters:
      - name: category_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - finance
      operationId: getExpenseCategory
      summary: 单个账单分类
      responses:
        '200':
          description: 分类，带 ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategoryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
    patch:
      tags:
        - finance
      operationId: updateExpenseCategory
      summary: 改名、改图标或排序
      description: 集合保护开启时，提交 sort_order 时需要本账号完整 categories 基线；同值提交也校验。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CollectionGuards'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCategoryPatch'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/CollectionPreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/CollectionPreconditionRequired'
    delete:
      tags:
        - finance
      operationId: deleteExpenseCategory
      summary: 软删除；仍被账目引用时返回 409 CATEGORY_IN_USE
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
  /trips:
    get:
      tags:
        - travel
      operationId: listTrips
      summary: 有效旅行列表；按阶段、归档、名称或目的地筛选，键集分页
      parameters:
        - name: q
          in: query
          required: false
          description: 匹配名称或目的地（不区分大小写的子串），最多 100 字符
          schema:
            type: string
            maxLength: 100
        - name: phase
          in: query
          required: false
          description: 按旅行时区当天计算的阶段
          schema:
            type: string
            enum:
              - planned
              - ongoing
              - ended
        - name: archived
          in: query
          required: false
          description: 只看已归档、只看未归档或全部；默认 all
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
              - all
            default: all
        - name: sort
          in: query
          required: false
          description: 排序；两种排序都以 id 降序作次序
          schema:
            type: string
            enum:
              - start_date_desc
              - start_date_asc
              - updated_at_desc
            default: start_date_desc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: 上一页返回的 next_cursor；改变筛选或排序需重新开始
          schema:
            type: string
      responses:
        '200':
          description: 一页旅行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags:
        - travel
      operationId: createTrip
      summary: 新建旅行；币种默认 CNY，时区默认账号默认时区
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: 已创建；data 为旅行的当前资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /trips/{trip_id}:
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - travel
      operationId: getTrip
      summary: 单个旅行的规范资源；回收站中的旅行返回 410 TRIP_DELETED
      responses:
        '200':
          description: 旅行，带 ETag
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
    patch:
      tags:
        - travel
      operationId: updateTrip
      summary: 局部更新；字段级合并，日期修改保留原行程，总预算在此修改
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripPatch'
      responses:
        '200':
          description: 已更新；warnings 可能含 MERGED_WITH_NEWER_VERSION、ITINERARY_OUTSIDE_TRIP_DATES、TIMEZONE_INTERPRETATION_CHANGED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
    delete:
      tags:
        - travel
      operationId: trashTrip
      summary: 整趟旅行进入回收站（30 天内可恢复）；要求版本相等
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: 已进入回收站；data 为带 deleted_at 与 purge_after_at 的旅行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
  /trips/{trip_id}/share:
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - travel
      operationId: getTripShare
      summary: 读取旅行的分享链接；未开启返回 404 SHARE_NOT_FOUND
      responses:
