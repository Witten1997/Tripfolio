    Trip:
      type: object
      description: 旅行的规范资源（接口设计 3.2）；同一结构也是同步日志与快照中的表示
      x-go-type: trip.Resource
      x-go-type-import:
        path: tripfolio/server/internal/modules/travel/trip
      required:
        - id
        - name
        - start_date
        - end_date
        - destination
        - notes
        - timezone
        - currency_code
        - budget_amount
        - route_short_mode
        - route_short_distance_meters
        - version
        - created_at
        - updated_at
        - archived_at
        - currency_locked_at
        - deleted_at
        - purge_after_at
        - purge_requested_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        start_date:
          $ref: '#/components/schemas/Date'
        end_date:
          $ref: '#/components/schemas/Date'
        destination:
          type: string
          maxLength: 300
        notes:
          type: string
          maxLength: 10000
        timezone:
          type: string
          maxLength: 64
          description: 本次旅行的唯一 IANA 时区，例如 Asia/Tokyo
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        budget_amount:
          type: string
          nullable: true
          description: 总预算；null 表示未设置，"0.00" 表示零预算；格式同 Money
          pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
        route_short_mode:
          type: string
          enum:
            - walking
            - cycling
          description: 直线距离位于短途区间时自动采用的方式
        route_short_distance_meters:
          type: integer
          minimum: 0
          maximum: 50000
          description: 短途区间上限，超过后自动采用驾车
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Instant'
        updated_at:
          $ref: '#/components/schemas/Instant'
        archived_at:
          type: string
          format: date-time
          nullable: true
          description: 归档时间；归档与旅行阶段独立
        currency_locked_at:
          type: string
          format: date-time
          nullable: true
          description: 存在有效账目时非空，此时币种不可改
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: 进入回收站的时间
        purge_after_at:
          type: string
          format: date-time
          nullable: true
          description: 回收站自动清理截止时间，在此之前可恢复
        purge_requested_at:
          type: string
          format: date-time
          nullable: true
          description: 已请求永久清理的时间，非空后不能再恢复
    TripListItem:
      description: 列表项：Trip 加按旅行时区当天计算的阶段；列表不提供单资源 ETag
      x-go-type: trip.ListItem
      x-go-type-import:
        path: tripfolio/server/internal/modules/travel/trip
      allOf:
        - $ref: '#/components/schemas/Trip'
        - type: object
          required:
            - phase
            - route_status
            - total_distance_meters
            - total_duration_seconds
          properties:
            phase:
              type: string
              enum:
                - planned
                - ongoing
                - ended
              description: planned 待出发 / ongoing 旅行中 / ended 已结束
            route_status:
              type: string
              enum:
                - stale
                - calculating
                - ready
                - incomplete
                - empty
            total_distance_meters:
              type: integer
              format: int64
              nullable: true
              minimum: 0
            total_duration_seconds:
              type: integer
              format: int64
              nullable: true
              minimum: 0
    TrashedTrip:
