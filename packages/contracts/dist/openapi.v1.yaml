      summary: 记录支出或退款；校验币种、分类有效与原支出关系，第一条有效账目锁定旅行币种
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCreate'
      responses:
