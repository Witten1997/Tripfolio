      enum:
        - even
        - ratio
        - personal
    LedgerSplit:
      type: object
      description: 一位参与人的份额；按币种最小单位取整，余数按参与人顺序补齐
      required:
        - member_id
        - amount
      properties:
        member_id:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
  responses:
    CollectionPreconditionFailed:
      description: 412 COLLECTION_CONFLICT 表示原集合基线已变化，保留输入并核对后再提交；VERSION_CONFLICT 表示实体版本冲突，conflict 提供当前版本与内容。不得自动换集合基线重试。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CollectionPreconditionRequired:
      description: 428 COLLECTION_BASE_REQUIRED 表示缺少本次操作需要的集合基线；需要实体版本的操作仍可返回 VERSION_REQUIRED（缺 If-Match）。
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: 请求无法解析、含未知字段或游标无效（MALFORMED_REQUEST、INVALID_CURSOR）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 缺少身份或会话失效（AUTH_REQUIRED、INVALID_CREDENTIALS、SESSION_EXPIRED）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 账号注销中、需要密码复验或跨站校验失败（ACCOUNT_DELETING、REAUTH_REQUIRED、CSRF_FAILED）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在、非本人或路径错属（RESOURCE_NOT_FOUND）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 类错误（IDEMPOTENCY_CONFLICT、ID_ALREADY_USED、ACCOUNT_ALREADY_EXISTS、CATEGORY_IN_USE 等）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 资源已删除或已清理（RESOURCE_GONE、TRIP_DELETED）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: 412 VERSION_CONFLICT，conflict 中给出当前版本、相交字段与当前内容
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionRequired:
      description: 428 VERSION_REQUIRED，缺少 If-Match
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 422 VALIDATION_FAILED 或其他 422 代码，errors 给出字段明细
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 RATE_LIMITED，带 Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 服务端错误（INTERNAL_ERROR）或依赖不可用（DEPENDENCY_UNAVAILABLE）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: 503 DEPENDENCY_UNAVAILABLE，对象存储或地点服务不可用、未配置或超时
      headers:
        Retry-After:
          description: 地点服务短时不可用时给出建议等待秒数；未配置、权限或配额不足时不提供，不自动重试
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
