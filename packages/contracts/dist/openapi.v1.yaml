      x-go-type-import:
        path: tripfolio/server/internal/modules/account
      required:
        - id
        - client_kind
        - device_name
        - created_at
        - last_seen_at
        - expires_at
        - is_current
      properties:
        id:
          type: string
          format: uuid
        client_kind:
          type: string
          enum:
            - web
