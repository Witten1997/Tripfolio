          maxLength: 64
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        budget_amount:
          type: string
          nullable: true
          pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
          description: 总预算，按币种小数位规范化；缺省或 null 表示未设置
    TripPatch:
      type: object
      description: |
        局部更新：缺省字段保持原值；budget_amount 显式 null 表示清空。
        修改日期保留已有行程；修改 timezone 只改变当地时间的解释；
        修改 currency_code 需要旅行没有有效账目（否则 409 CURRENCY_LOCKED），
        且总预算与行程预计费用都为空（否则 409 CURRENCY_AMOUNTS_EXIST）。
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        start_date:
          $ref: '#/components/schemas/Date'
        end_date:
          $ref: '#/components/schemas/Date'
        destination:
          type: string
          maxLength: 300
        notes:
          type: string
          maxLength: 10000
        timezone:
          type: string
          maxLength: 64
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        budget_amount:
          type: string
          nullable: true
          pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
        route_short_mode:
          type: string
          enum:
            - walking
            - cycling
        route_short_distance_meters:
          type: integer
          minimum: 0
          maximum: 50000
