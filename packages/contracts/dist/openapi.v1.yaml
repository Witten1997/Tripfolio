    TodoPage:
      type: object
      description: Page<TodoListItem>；按 due_on 升序（空日期最后）、再按 id 升序
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodoListItem'
        next_cursor:
          type: string
          nullable: true
    TodoCreate:
      type: object
      description: 创建待办；completed=true 时服务端同时写入 completed_at
      required:
        - id
        - title
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_on:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        notes:
          type: string
          maxLength: 4000
        completed:
          type: boolean
          default: false
    TodoPatch:
      type: object
      description: 局部更新：缺省字段保持原值；due_on 显式 null 表示清空；completed 可设为 true 或 false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        due_on:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        notes:
          type: string
          maxLength: 4000
        completed:
          type: boolean
    LedgerKind:
      type: string
      description: 账目类型；金额一律为正数，方向由类型决定。创建后不可改
      enum:
        - expense
        - refund
    LedgerEntry:
      type: object
      description: |
        账目（支出或退款）的规范资源（接口设计 3.5）；同一结构也是同步日志与快照中的表示。
        currency_code 由旅行派生，只读；attachment_asset_ids 是票据图片资产 ID，不含临时下载地址。
      x-go-type: finance.LedgerResource
      x-go-type-import:
        path: tripfolio/server/internal/modules/finance
      required:
        - id
        - trip_id
        - kind
        - amount
        - currency_code
        - category_id
        - occurred_on
        - notes
        - refunded_entry_id
        - attachment_asset_ids
        - version
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LedgerKind'
        amount:
          $ref: '#/components/schemas/Money'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        category_id:
          type: string
          format: uuid
        occurred_on:
          $ref: '#/components/schemas/Date'
        notes:
          type: string
          maxLength: 4000
        refunded_entry_id:
          type: string
          format: uuid
          nullable: true
          description: 退款关联的原支出；独立退款与支出为 null
        attachment_asset_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
        version:
          $ref: '#/components/schemas/Version'
        created_at:
          $ref: '#/components/schemas/Instant'
        updated_at:
          $ref: '#/components/schemas/Instant'
        deleted_at:
          type: string
          format: date-time
          nullable: true
    LedgerEntryResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LedgerEntry'
    LedgerPage:
      type: object
      description: Page<LedgerEntry>；按 occurred_on、id 均降序
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        next_cursor:
          type: string
          nullable: true
    LedgerCreate:
      type: object
      description: |
        创建支出或退款。currency_code 可省略，提供时必须等于旅行币种（否则 422 CURRENCY_MISMATCH）；
        occurred_on 默认旅行时区的今天。退款可通过 refunded_entry_id 关联同旅行的有效支出，
        分类须与原支出一致，关联退款合计不得超过原支出金额（422 REFUND_AMOUNT_EXCEEDED）。
      required:
        - id
        - kind
        - amount
        - category_id
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/LedgerKind'
        amount:
          $ref: '#/components/schemas/Money'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        category_id:
          type: string
          format: uuid
        occurred_on:
          $ref: '#/components/schemas/Date'
        notes:
          type: string
          maxLength: 4000
        refunded_entry_id:
          type: string
          format: uuid
          nullable: true
          description: 仅 kind=refund 可填写
        attachment_asset_ids:
          type: array
          maxItems: 10
          description: 同旅行、未删除的图片资产；顺序即显示顺序
          items:
            type: string
            format: uuid
    LedgerPatch:
      type: object
      description: |
        局部更新：缺省字段保持原值；refunded_entry_id 显式 null 表示解除关联；attachment_asset_ids 出现时整体替换。
        kind 不可改。修改原支出的金额须仍能覆盖其关联退款；修改原支出的分类会同事务更新其关联退款。
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        category_id:
          type: string
          format: uuid
        occurred_on:
          $ref: '#/components/schemas/Date'
        notes:
          type: string
          maxLength: 4000
        refunded_entry_id:
          type: string
          format: uuid
          nullable: true
        attachment_asset_ids:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
    StatisticsScope:
      type: object
      description: 实际采用的筛选范围；未筛选的项为 null
      required:
        - date_from
        - date_to
        - category_id
      properties:
        date_from:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        date_to:
          type: string
          nullable: true
          pattern: ^\d{4}-\d{2}-\d{2}$
        category_id:
          type: string
          format: uuid
          nullable: true
    StatisticsTotals:
      type: object
      description: 筛选范围内的支出、退款、净额与账目条数；净额 = 支出 − 退款，可能为负
      required:
        - expense_amount
        - refund_amount
        - net_amount
        - entry_count
      properties:
        expense_amount:
          $ref: '#/components/schemas/Money'
        refund_amount:
          $ref: '#/components/schemas/Money'
        net_amount:
          $ref: '#/components/schemas/SignedMoney'
        entry_count:
          type: integer
          format: int64
          minimum: 0
    TripBudget:
      type: object
      description: 整趟旅行的预算对比；不受日期与分类筛选影响。无总预算时 remaining_amount 与 overspent_amount 为 null
      required:
        - budget_amount
        - trip_net_amount
        - remaining_amount
        - overspent_amount
      properties:
        budget_amount:
          type: string
          nullable: true
          pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
          description: 旅行的 budget_amount；未设置为 null
        trip_net_amount:
          $ref: '#/components/schemas/SignedMoney'
        remaining_amount:
          type: string
          nullable: true
          pattern: ^-?[0-9]{1,14}(\.[0-9]{1,4})?$
          description: 总预算 − 整趟净支出；可能为负，不改为零
        overspent_amount:
          type: string
          nullable: true
          pattern: ^[0-9]{1,14}(\.[0-9]{1,4})?$
          description: max(整趟净支出 − 总预算, 0)
    CategoryTotals:
      type: object
      description: 单个分类在筛选范围内的汇总；share 仅供展示，不参与金额结算
      required:
        - category_id
        - name
        - icon
        - expense_amount
        - refund_amount
        - net_amount
        - share
        - trip_category_net_amount
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
          nullable: true
        expense_amount:
          $ref: '#/components/schemas/Money'
        refund_amount:
          $ref: '#/components/schemas/Money'
        net_amount:
          $ref: '#/components/schemas/SignedMoney'
        share:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: 分类净额占筛选后总净额的比例；ratio_available=false 时为 null
        trip_category_net_amount:
          $ref: '#/components/schemas/SignedMoney'
    DailyTotals:
      type: object
      required:
        - date
        - expense_amount
        - refund_amount
        - net_amount
      properties:
        date:
          $ref: '#/components/schemas/Date'
        expense_amount:
          $ref: '#/components/schemas/Money'
        refund_amount:
          $ref: '#/components/schemas/Money'
        net_amount:
          $ref: '#/components/schemas/SignedMoney'
    DailyTotalsPage:
      type: object
      description: Page<DailyTotals>；按日期降序，只含有账目的日期
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyTotals'
        next_cursor:
          type: string
          nullable: true
    TripStatistics:
      type: object
      description: |
        旅行开支统计（接口设计 3.8）。日期与分类筛选只影响 filtered_totals、by_category 的筛选金额与 daily；
        trip_budget 始终基于整趟旅行的累计净支出。by_category 包含每个当前有效分类以及仍被有效账目引用的已删除分类。
      x-go-type: finance.Statistics
      x-go-type-import:
        path: tripfolio/server/internal/modules/finance
      required:
        - scope
        - currency_code
        - filtered_totals
        - trip_budget
        - by_category
        - ratio_available
        - daily
      properties:
        scope:
          $ref: '#/components/schemas/StatisticsScope'
        currency_code:
          $ref: '#/components/schemas/CurrencyCode'
        filtered_totals:
          $ref: '#/components/schemas/StatisticsTotals'
        trip_budget:
          $ref: '#/components/schemas/TripBudget'
        by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryTotals'
        ratio_available:
          type: boolean
          description: 仅筛选后总净额 > 0 且各分类净额 >= 0 时为 true；否则各 share 为 null
        daily:
          $ref: '#/components/schemas/DailyTotalsPage'
    TripStatisticsResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/TripStatistics'
  responses:
    BadRequest:
      description: 请求无法解析、含未知字段或游标无效（MALFORMED_REQUEST、INVALID_CURSOR）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 缺少身份或会话失效（AUTH_REQUIRED、INVALID_CREDENTIALS、SESSION_EXPIRED）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 账号注销中、需要密码复验或跨站校验失败（ACCOUNT_DELETING、REAUTH_REQUIRED、CSRF_FAILED）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在、非本人或路径错属（RESOURCE_NOT_FOUND）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 409 类错误（IDEMPOTENCY_CONFLICT、ID_ALREADY_USED、ACCOUNT_ALREADY_EXISTS、CATEGORY_IN_USE 等）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 资源已删除或已清理（RESOURCE_GONE、TRIP_DELETED）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: 412 VERSION_CONFLICT，conflict 中给出当前版本、相交字段与当前内容
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionRequired:
      description: 428 VERSION_REQUIRED，缺少 If-Match
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: 422 VALIDATION_FAILED 或其他 422 代码，errors 给出字段明细
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: 429 RATE_LIMITED，带 Retry-After
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 服务端错误（INTERNAL_ERROR）或依赖不可用（DEPENDENCY_UNAVAILABLE）
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
