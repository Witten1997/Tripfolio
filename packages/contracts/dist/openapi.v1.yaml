            - harmony
        device_name:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Instant'
        last_seen_at:
          $ref: '#/components/schemas/Instant'
        expires_at:
          $ref: '#/components/schemas/Instant'
        is_current:
          type: boolean
    SessionListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    ExpenseCategory:
      type: object
