        csrf_token:
          type: string
          description: 仅网页端返回，同时以非 HttpOnly Cookie 设置
        account:
          $ref: '#/components/schemas/Account'
    AuthResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AuthResult'
    AccountPatch:
      type: object
