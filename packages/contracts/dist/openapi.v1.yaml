openapi: 3.0.3
info:
  title: Tripfolio API
  version: 0.3.0
  description: |
    Tripfolio P0 业务接口契约。人可读设计见 `docs/api/2026-09-11-P0接口设计.md`；
    本文件及 `paths/`、`schemas/` 下的拆分文件是生成 Go 服务端接口（oapi-codegen）与
    TypeScript 客户端类型（openapi-typescript）的唯一来源。修改契约先改这里，再运行
    `pnpm --filter @tripfolio/contracts build` 与后端的 `go generate ./internal/transport/httpapi/`。

    约定摘要（详见接口设计 1.1–1.4）：
    - 业务路径统一前缀 `/api/v1`；探针 `/health/live`、`/health/ready` 不在本契约内。
    - 每个响应都带 `X-Request-ID` 头；客户端传入合法值（1–128 位字母、数字、`.`、`_`、`-`）时原样返回。
    - 单资源响应为 `{ "data": resource }`，写响应为 `{ "data": WriteResult }`，分页列表为 `Page<T>`。
    - 写请求带 `Idempotency-Key`（UUID）；修改与删除带 `If-Match: "<version>"`。
    - 错误使用 `application/problem+json`，字段见 `Problem`；错误代码清单以接口设计 1.4 为准。
    - 金额为十进制字符串，按币种小数位规范化；日期为 `YYYY-MM-DD`；当地日期时间不带时区。
    - 部分模型带 `x-go-type`：Go 服务端直接使用业务类型，同一类型也是同步日志中的快照。
  license:
    name: Proprietary
    url: https://example.invalid/tripfolio/license
servers:
  - url: /api/v1
    description: 业务接口统一前缀（同源部署时使用相对路径）
security:
  - bearerAuth: []
tags:
  - name: sync
    description: 原生账号增量同步与协议发现
  - name: metadata
    description: 固定枚举、币种精度、上传上限与协议版本
  - name: auth
    description: 注册、登录、刷新、找回密码与密码复验
  - name: account
    description: 个人资料与会话
  - name: finance
    description: 账单分类、账目与统计
  - name: travel
    description: 旅行、回收站与旅行内容
  - name: assets
    description: 私有文件资产的上传授权、确认与下载授权
  - name: geo
    description: 高德地点搜索、选点与交通路线
  - name: public
    description: 访客凭分享令牌读取的只读接口
paths:
  /sync/status:
    get:
      tags:
        - sync
      operationId: getSyncStatus
      summary: 查询原生账号同步协议能力
      description: 未装配完整同步能力时返回 503。成功响应不包含拉取起点，必须先完成基线快照。
      responses:
        '200':
          description: 协议与保留边界配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 同步能力尚不可用
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sync/push:
    post:
      tags:
        - sync
      operationId: pushSync
      summary: 按依赖顺序推送原生客户端操作
      description: 每项独立事务，重复提交返回原提交事实。当前仅旅行五项操作有执行器，其他已知类型逐项拒绝；完整能力验收前不生产装配。
      parameters:
        - name: X-Tripfolio-Sync-Version
          in: header
          required: false
          description: 必须为2；缺失返回426。
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushInput'
      responses:
        '200':
          description: 按输入顺序返回逐操作结果，不承诺整批成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 请求大于1 MiB、操作大于64 KiB或操作数量超限
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '415':
          description: 不支持压缩正文
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 同步协议不支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /sync/changes:
    get:
      tags:
        - sync
      operationId: getSyncChanges
      summary: 读取账号固定高水位的一页增量
      description: 不按旅行过滤；允许一页截断批次。末页 next_cursor 是下轮 checkpoint，commit_cursor 和本地 apply_cursor 不能用于此接口。
      parameters:
        - name: X-Tripfolio-Sync-Version
          in: header
          required: false
          description: 必须为 2；省略或不支持时由服务返回 426 SYNC_PROTOCOL_UNSUPPORTED。
          schema:
            type: string
        - name: cursor
          in: query
          required: true
          description: 完整基线或上一页签发的账号专属游标
          schema:
            type: string
            minLength: 1
            maxLength: 8192
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: 有序事件和可持久化的扫描游标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChangesPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: SYNC_EPOCH_MISMATCH，需要新基线并隔离旧操作
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: CURSOR_EXPIRED，历史不完整或超过保留边界
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          description: SYNC_PROTOCOL_UNSUPPORTED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 同步能力或历史结构暂不可用，不得推进游标
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sync/snapshots:
    post:
      tags:
        - sync
      operationId: createSyncSnapshot
      summary: 创建账号一致快照任务
      parameters:
        - name: X-Tripfolio-Sync-Version
          in: header
          required: false
          description: 必须为2，否则返回426。
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotInput'
      responses:
        '202':
          description: 创建账号一致快照任务成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/DataSnapshot'
        '400':
          description: 请求或游标无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 身份失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 账号或客户端不允许
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 范围不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: epoch、幂等冲突或快照尚未就绪
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 快照或目标旅行已失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 请求校验失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 同步协议不支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 依赖尚未就绪
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sync/snapshots/{snapshot_id}:
    get:
      tags:
        - sync
      operationId: getSyncSnapshot
      summary: 读取快照任务状态
      parameters:
        - name: X-Tripfolio-Sync-Version
          in: header
          required: false
          description: 必须为2，否则返回426。
          schema:
            type: string
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 读取快照任务状态成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSnapshot'
        '400':
          description: 请求或游标无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 身份失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 账号或客户端不允许
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 范围不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: epoch、幂等冲突或快照尚未就绪
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 快照或目标旅行已失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 请求校验失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 同步协议不支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 依赖尚未就绪
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /sync/snapshots/{snapshot_id}/items:
    get:
      tags:
        - sync
      operationId: getSyncSnapshotItems
      summary: 读取不可变快照条目
      parameters:
        - name: X-Tripfolio-Sync-Version
          in: header
          required: false
          description: 必须为2，否则返回426。
          schema:
            type: string
        - name: snapshot_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 8192
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: 读取不可变快照条目成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotPage'
        '400':
          description: 请求或游标无效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 身份失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 账号或客户端不允许
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 范围不存在
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: epoch、幂等冲突或快照尚未就绪
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '410':
          description: 快照或目标旅行已失效
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 请求校验失败
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '426':
          description: 同步协议不支持
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: 内部错误
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: 依赖尚未就绪
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /deletion-jobs/{job_id}:
    get:
      tags:
        - account
      operationId: getDeletionJob
      summary: 本人旅行清理进度
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /recycle-bin/trips/{trip_id}/deletion-job:
    get:
      tags:
        - account
      operationId: getTripDeletionJob
      summary: 按旅行找回最近清理任务，清理完成后仍可查询
      parameters:
        - name: trip_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /deletion-jobs/{job_id}/retry:
    post:
      tags:
        - account
      operationId: retryDeletionJob
      summary: 重试本人失败或中断的旅行清理；If-Match 为旅行当前版本，需近期认证
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /account/deletion:
    post:
      tags:
        - account
      operationId: requestAccountDeletion
      summary: 近期认证后注销本人账号；同幂等键重放返回同一任务并轮换查询凭证
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountDeletionRequest'
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /account/deletion/{job_id}/receipt:
    post:
      tags:
        - account
      operationId: renewDeletionReceipt
      summary: 注销中凭原有效会话补领凭证；每次轮换，旧凭证立即失效
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /account/deletion/{job_id}:
    get:
      tags:
        - account
      operationId: getAccountDeletion
      summary: 只凭 Deletion 查询凭证读取任务，账号删除后仍可查询
      security:
        - deletionAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 凭证或任务已过期，完成七天后删除最小任务记录
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
  /trips/{trip_id}/photos:
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - travel
      operationId: listPhotos
      summary: recorded_on 降序；同日 taken_at_local 升序、空值最后，再按 sort_order、id 升序Photo
      parameters:
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '428':
          $ref: '#/components/responses/VersionRequired'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
    post:
      tags:
        - travel
      operationId: createPhoto
      summary: 创建Photo
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoCreate'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
