  /trips/{trip_id}/ledger-import:
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - finance
      operationId: commitLedgerImport
      summary: 确认已预览的 Excel，整批事务导入支出；同一批次重试不重复入账
      description: 集合保护开启时，提交预览返回的 members 基线和原 preview_digest，整批在同一事务中校验；保留原文件与基线重试。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CollectionGuards'
        - name: preview_digest
          in: query
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{64}$
          description: 预览返回的摘要；文件、分类或成员设置变化后必须重新预览
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: 与预览相同的 .xlsx 文件，最大 5 MB
      responses:
        '201':
          description: 全部导入成功，affected 包含所有账单；结果不明时沿用同一 Idempotency-Key 重试
          content:
            application/json:
