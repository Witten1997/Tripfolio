TripListPath:
  get:
    tags: [admin-trips]
    operationId: adminTrips
    summary: 分页检索全平台旅行
    parameters:
      - name: account_id
        in: query
        schema: { type: string, format: uuid }
      - name: q
        in: query
        schema: { type: string, maxLength: 120 }
      - name: phase
        in: query
        schema: { type: string, enum: [planned, ongoing, ended] }
      - name: archived
        in: query
        schema: { type: string, enum: ['all', 'true', 'false'], default: 'all' }
      - name: trash
        in: query
        schema: { type: string, enum: [exclude, only, all], default: exclude }
      - name: date_from
        in: query
        description: 旅行日期范围与筛选区间有交集即匹配，起止日均包含
        schema: { type: string, format: date }
      - name: date_to
        in: query
        schema: { type: string, format: date }
      - $ref: '#/parameters/Page'
      - $ref: '#/parameters/PageSize'
    responses:
      '200':
        description: 旅行列表，阶段按每趟旅行自己的时区计算
        content:
          application/json:
            schema: { $ref: '#/schemas/AdminTripPage' }
      default:
        $ref: ./openapi.yaml#/components/responses/Problem
TripPath:
  get:
    tags: [admin-trips]
    operationId: adminTrip
    summary: 查看旅行概况及内容数量
    parameters:
      - $ref: '#/parameters/TripID'
    responses:
      '200':
        description: 旅行概况，包含回收站状态，不返回私人内容明细
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/schemas/AdminTripDetail' }
      default:
        $ref: ./openapi.yaml#/components/responses/Problem
parameters:
  TripID:
    name: trip_id
    in: path
    required: true
    schema: { type: string, format: uuid }
  Page:
    name: page
    in: query
    schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
  PageSize:
    name: page_size
    in: query
    schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
schemas:
  AdminOwner:
    type: object
    required: [id, email, nickname]
    properties:
      id: { type: string, format: uuid }
      email: { type: string }
      nickname: { type: string }
  AdminTripSummary:
    type: object
    required:
      [
        id,
        owner,
        name,
        destination,
        start_date,
        end_date,
        phase,
        archived_at,
        deleted_at,
        updated_at,
      ]
    properties:
      id: { type: string, format: uuid }
      owner: { $ref: '#/schemas/AdminOwner' }
      name: { type: string }
      destination: { type: string }
      start_date: { type: string, format: date }
      end_date: { type: string, format: date }
      phase: { type: string, enum: [planned, ongoing, ended] }
      archived_at: { type: string, format: date-time, nullable: true }
      deleted_at: { type: string, format: date-time, nullable: true }
      updated_at: { type: string, format: date-time }
  AdminTripPage:
    type: object
    required: [data, total, page, page_size]
    properties:
      data:
        type: array
        items: { $ref: '#/schemas/AdminTripSummary' }
      total: { type: integer, format: int64 }
      page: { type: integer }
      page_size: { type: integer }
  AdminTripDetail:
    type: object
    required: [trip, owner, phase, counts]
    properties:
      trip: { $ref: '#/schemas/AdminTripOverview' }
      owner: { $ref: '#/schemas/AdminOwner' }
      phase: { type: string, enum: [planned, ongoing, ended] }
      counts: { $ref: '#/schemas/AdminTripCounts' }
  AdminTripOverview:
    type: object
    required:
      [
        id,
        name,
        destination,
        start_date,
        end_date,
        budget_amount,
        currency_code,
        archived_at,
        deleted_at,
        purge_requested_at,
        updated_at,
      ]
    properties:
      id: { type: string, format: uuid }
      name: { type: string }
      destination: { type: string }
      start_date: { type: string, format: date }
      end_date: { type: string, format: date }
      budget_amount: { type: string, nullable: true, description: 按旅行币种小数位返回的预算 }
      currency_code: { type: string }
      archived_at: { type: string, format: date-time, nullable: true }
      deleted_at: { type: string, format: date-time, nullable: true }
      purge_requested_at: { type: string, format: date-time, nullable: true }
      updated_at: { type: string, format: date-time }
  AdminTripCounts:
    type: object
    description: 仅统计未单独删除的内容数量，不返回内容明细；旅行在回收站时仍可查看数量。
    required: [itinerary, packing, todos, members]
    properties:
      itinerary: { type: integer, format: int64, minimum: 0 }
      packing: { type: integer, format: int64, minimum: 0 }
      todos: { type: integer, format: int64, minimum: 0 }
      members: { type: integer, format: int64, minimum: 0 }
