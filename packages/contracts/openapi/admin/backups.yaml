SettingsPath:
  get:
    tags: [admin-operations]
    operationId: adminBackupSettings
    summary: 查看备份设置，密码只返回是否已设置
    responses:
      '200':
        description: 当前设置
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/BackupSettings' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
  put:
    tags: [admin-operations]
    operationId: adminUpdateBackupSettings
    summary: 保存备份设置
    parameters:
      - $ref: './openapi.yaml#/components/parameters/CSRF'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/BackupUpdate' }
    responses:
      '200':
        description: 已保存
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/BackupSettings' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
ProbePath:
  post:
    tags: [admin-operations]
    operationId: adminTestBackupStorage
    summary: 检查已保存 WebDAV 的创建、读写、校验及删除能力
    parameters:
      - $ref: './openapi.yaml#/components/parameters/CSRF'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/BackupAction' }
    responses:
      '204': { description: WebDAV 检查通过 }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
RunsPath:
  get:
    tags: [admin-operations]
    operationId: adminBackupRuns
    summary: 分页查询备份记录
    parameters:
      - name: page
        in: query
        schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    responses:
      '200':
        description: 备份记录
        content:
          application/json:
            schema: { $ref: '#/BackupPage' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
  post:
    tags: [admin-operations]
    operationId: adminRequestBackup
    summary: 请求立即备份
    parameters:
      - $ref: './openapi.yaml#/components/parameters/CSRF'
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/BackupAction' }
    responses:
      '202':
        description: 备份已入队
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/BackupRun' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
RetryPath:
  post:
    tags: [admin-operations]
    operationId: adminRetryBackup
    summary: 重试当前 WebDAV 目标中的失败备份
    parameters:
      - $ref: './openapi.yaml#/components/parameters/CSRF'
      - name: backup_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '#/BackupAction' }
    responses:
      '202':
        description: 重试已入队
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/BackupRun' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
BackupSettings:
  type: object
  required: [enabled, time, retain, url, username, password_set, version, next_at, ready, readiness]
  properties:
    restore_ready: { type: boolean }
    restore_readiness: { type: string }
    enabled: { type: boolean }
    time: { type: string }
    retain: { type: integer }
    url: { type: string }
    username: { type: string }
    password_set: { type: boolean }
    version: { type: integer, format: int64 }
    next_at: { type: string, format: date-time, nullable: true }
    ready: { type: boolean }
    readiness: { type: string }
BackupUpdate:
  type: object
  additionalProperties: false
  required: [enabled, time, retain, url, username, password, version, reason]
  properties:
    enabled: { type: boolean }
    time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
    retain: { type: integer, minimum: 1, maximum: 90 }
    url: { type: string, maxLength: 2048 }
    username: { type: string, maxLength: 256 }
    password:
      { type: string, maxLength: 2048, description: 留空保留已有密码；更换目标或用户名时必填 }
    version: { type: integer, format: int64, minimum: 1 }
    reason: { type: string, minLength: 1, maxLength: 500 }
BackupAction:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    reason: { type: string, minLength: 1, maxLength: 500 }
BackupRun:
  type: object
  required:
    [
      id,
      trigger,
      state,
      created_at,
      started_at,
      snapshot_at,
      finished_at,
      size_bytes,
      sha256,
      error_code,
      cleanup_error,
      remote_deleted_at,
    ]
  properties:
    id: { type: string, format: uuid }
    trigger: { type: string, enum: [manual, scheduled] }
    state:
      { type: string, enum: [queued, running, uploading, verifying, retrying, succeeded, failed] }
    created_at: { type: string, format: date-time }
    started_at: { type: string, format: date-time, nullable: true }
    snapshot_at: { type: string, format: date-time, nullable: true }
    finished_at: { type: string, format: date-time, nullable: true }
    size_bytes: { type: integer, format: int64 }
    sha256: { type: string }
    error_code: { type: string }
    cleanup_error: { type: string }
    remote_deleted_at: { type: string, format: date-time, nullable: true }
BackupPage:
  type: object
  required: [data, total, page, page_size]
  properties:
    data:
      type: array
      items: { $ref: '#/BackupRun' }
    total: { type: integer, format: int64 }
    page: { type: integer }
    page_size: { type: integer }
RestorePath:
  post:
    tags: [admin-operations]
    operationId: adminRestoreBackup
    summary: 确认覆盖当前数据库，需近期管理员密码复验
    parameters:
      - $ref: './openapi.yaml#/components/parameters/CSRF'
      - name: backup_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [confirmation, reason, password]
            properties:
              confirmation: { type: string, enum: [确认覆盖当前数据库] }
              reason: { type: string, minLength: 1, maxLength: 500 }
              password:
                {
                  type: string,
                  maxLength: 1024,
                  description: 备份当时的加密密码，留空使用服务器当前配置,
                }
    responses:
      '202':
        description: 恢复已受理，保存返回的 token 查询状态
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/RestoreJob' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
RemotePath:
  get:
    tags: [admin-operations]
    operationId: adminRemoteBackups
    summary: 查找已保存 WebDAV 根目录中的其他部署及备份，无需本地备份记录
    parameters:
      - name: destination
        in: query
        schema: { type: string, format: uuid }
        description: 不传时列出部署目录；传入目录编号时分页列出该目录的完整备份
      - name: page
        in: query
        schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    responses:
      '200':
        description: 目录或备份列表，按远端文件修改时间倒序；skipped 为本页无效备份数量
        content:
          application/json:
            schema: { $ref: '#/RemoteBackupPage' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
RemoteBackup:
  type: object
  required: [id, destination, snapshot_at, size_bytes, sha256, goose_version]
  properties:
    id: { type: string, format: uuid }
    destination: { type: string, format: uuid }
    snapshot_at: { type: string, format: date-time }
    size_bytes: { type: integer, format: int64 }
    sha256: { type: string }
    goose_version: { type: integer, format: int64 }
RemoteBackupPage:
  type: object
  required: [destinations, data, total, page, page_size, skipped, settings_version]
  properties:
    destinations:
      type: array
      items: { type: string, format: uuid }
    data:
      type: array
      items: { $ref: '#/RemoteBackup' }
    total: { type: integer }
    page: { type: integer }
    page_size: { type: integer }
    skipped: { type: integer }
    settings_version: { type: integer, format: int64 }
RemoteRestorePath:
  post:
    tags: [admin-operations]
    operationId: adminRestoreRemoteBackup
    summary: 使用远端备份覆盖当前数据库，需明确确认及近期管理员密码复验
    parameters:
      - $ref: './openapi.yaml#/components/parameters/CSRF'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id, destination, sha256, settings_version, confirmation, reason, password]
            properties:
              id: { type: string, format: uuid }
              destination: { type: string, format: uuid }
              sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
              settings_version: { type: integer, format: int64, minimum: 1 }
              confirmation: { type: string, enum: [确认覆盖当前数据库] }
              reason: { type: string, minLength: 1, maxLength: 500 }
              password:
                { type: string, maxLength: 1024, description: 备份当时的加密密码，留空使用当前配置 }
    responses:
      '202':
        description: 恢复已受理，远端备份不会加入本地保留策略
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/RestoreJob' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
RestoreStatusPath:
  get:
    tags: [admin-operations]
    operationId: adminRestoreStatus
    summary: 使用此次恢复专用令牌查询结果，令牌有效期 24 小时
    security: []
    parameters:
      - name: restore_id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: X-Restore-Token
        in: header
        required: true
        schema: { type: string, minLength: 43, maxLength: 43 }
    responses:
      '200':
        description: 恢复状态，不包含备份凭证或业务数据
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { $ref: '#/RestoreJob' }
      default: { $ref: './openapi.yaml#/components/responses/Problem' }
RestoreJob:
  type: object
  required: [id, backup_id, state, created_at, started_at, finished_at, error_code, message]
  properties:
    id: { type: string, format: uuid }
    backup_id: { type: string, format: uuid }
    state: { type: string, enum: [queued, preparing, restoring, succeeded, failed] }
    created_at: { type: string, format: date-time }
    started_at: { type: string, format: date-time, nullable: true }
    finished_at: { type: string, format: date-time, nullable: true }
    error_code: { type: string }
    message: { type: string }
    token: { type: string, description: 仅提交时返回的恢复进度查询令牌 }
