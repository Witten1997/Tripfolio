SyncSeq:
  type: string
  pattern: '^(0|[1-9][0-9]*)$'
  maxLength: 19
  description: 精确的非负十进制整数，不超过 9223372036854775807；不得转浮点数。

SyncStatus:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.Status
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [supported_protocol_versions, recommended_protocol_version, sync_epoch, server_time, retention_days, snapshot_ttl_seconds, limits]
  properties:
    supported_protocol_versions:
      type: array
      items: {type: integer, enum: [2]}
    recommended_protocol_version: {type: integer, enum: [2]}
    sync_epoch: {type: string, format: uuid}
    server_time: {type: string, format: date-time}
    retention_days: {type: integer, minimum: 90}
    snapshot_ttl_seconds: {type: integer, enum: [86400]}
    limits:
      type: object
      additionalProperties: false
      required: [max_operations, max_operation_bytes, max_request_bytes, max_dependencies]
      properties:
        max_operations: {type: integer, enum: [100]}
        max_operation_bytes: {type: integer, enum: [65536]}
        max_request_bytes: {type: integer, enum: [1048576]}
        max_dependencies: {type: integer, enum: [100]}

SyncChange:
  type: object
  additionalProperties: false
  required: [seq, batch_id, batch_end_seq, entity_type, entity_id, trip_id, version, kind, schema_version, requires_snapshot, changed_fields, data]
  properties:
    seq: {$ref: '#/SyncSeq'}
    batch_id: {type: string, format: uuid}
    batch_end_seq: {$ref: '#/SyncSeq'}
    entity_type:
      type: string
      enum: [trip, trip_member, expense_category, itinerary_item, ledger_entry, packing_item, todo, reservation, document, photo, asset]
    entity_id: {type: string, format: uuid}
    trip_id: {type: string, format: uuid, nullable: true}
    version:
      type: string
      pattern: '^[1-9][0-9]*$'
      maxLength: 19
    kind: {type: string, enum: [upsert, delete, purge, redacted]}
    schema_version: {type: integer, enum: [2]}
    requires_snapshot: {type: boolean}
    changed_fields:
      type: array
      nullable: true
      items: {type: string}
    data:
      type: object
      nullable: true
      additionalProperties: true
      description: 此版本的白名单业务资源；delete/purge/redacted 为 null，不含文件密钥或凭证。

SyncChangesPage:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.Page
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [sync_epoch, changes, next_cursor, has_more]
  properties:
    sync_epoch: {type: string, format: uuid}
    changes:
      type: array
      items: {$ref: '#/SyncChange'}
    next_cursor:
      type: string
      description: 每页均返回，包括空终页；与整页 inbox 在同一客户端事务保存。
    has_more: {type: boolean}

SnapshotInput:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.SnapshotInput
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [sync_epoch, purpose, selected_trip_ids]
  properties:
    sync_epoch: {type: string, format: uuid}
    purpose: {type: string, enum: [baseline, trip_reload]}
    selected_trip_ids:
      type: array
      items: {type: string, format: uuid}

DataSnapshot:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.Snapshot
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [id, purpose, selected_trip_ids, status, schema_version, sync_epoch, high_water_seq, item_count, captured_at, expires_at, error_code]
  properties:
    id: {type: string, format: uuid}
    purpose: {type: string, enum: [baseline, trip_reload]}
    selected_trip_ids:
      type: array
      items: {type: string, format: uuid}
    status: {type: string, enum: [queued, building, ready, failed, invalidated, expired]}
    schema_version: {type: integer, enum: [2]}
    sync_epoch: {type: string, format: uuid}
    high_water_seq: {type: string, pattern: '^(0|[1-9][0-9]*)$', nullable: true}
    item_count: {$ref: '#/SyncSeq'}
    captured_at: {type: string, format: date-time, nullable: true}
    expires_at: {type: string, format: date-time}
    error_code: {type: string, nullable: true}

SnapshotItem:
  type: object
  additionalProperties: false
  required: [ordinal, entity_type, entity_id, trip_id, version, data]
  properties:
    ordinal: {$ref: '#/SyncSeq'}
    entity_type:
      type: string
      enum: [trip, trip_member, expense_category, itinerary_item, ledger_entry, packing_item, todo, reservation, document, photo, asset]
    entity_id: {type: string, format: uuid}
    trip_id: {type: string, format: uuid, nullable: true}
    version: {type: string, pattern: '^[1-9][0-9]*$'}
    data:
      type: object
      additionalProperties: true
      description: 同一捕获视图中的白名单业务资源，不含凭据或文件字节。

SnapshotPage:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.SnapshotPage
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [snapshot_id, sync_epoch, items, next_cursor, has_more, item_count, high_water_seq, baseline_cursor]
  properties:
    snapshot_id: {type: string, format: uuid}
    sync_epoch: {type: string, format: uuid}
    items:
      type: array
      items: {$ref: '#/SnapshotItem'}
    next_cursor: {type: string, nullable: true}
    has_more: {type: boolean}
    item_count: {$ref: '#/SyncSeq'}
    high_water_seq: {$ref: '#/SyncSeq'}
    baseline_cursor:
      type: string
      nullable: true
      description: 仅baseline最后一页提供；trip_reload始终为null。

SyncPushInput:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.PushInput
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [sync_epoch, client_id, operations]
  properties:
    sync_epoch: {type: string, format: uuid}
    client_id: {type: string, format: uuid}
    operations:
      type: array
      minItems: 1
      maxItems: 100
      items: {$ref: '#/SyncOperation'}

SyncOperation:
  type: object
  additionalProperties: false
  required: [operation_id, type, entity_type, entity_id, trip_id, base, guards, depends_on, payload]
  properties:
    operation_id: {type: string, format: uuid}
    type:
      type: string
      enum: [trip.create, trip.update, trip.set_archived, trip.delete, trip.restore, expense_category.create, expense_category.update, expense_category.delete, expense_category.reorder, trip_member.replace, itinerary_item.create, itinerary_item.update, itinerary_item.delete, itinerary_item.reorder, ledger_entry.create, ledger_entry.update, ledger_entry.delete, packing_item.create, packing_item.update, packing_item.set_status, packing_item.delete, packing_item.reorder, todo.create, todo.update, todo.set_completed, todo.delete, todo.reorder, reservation.create, reservation.update, reservation.delete, document.create, document.update, document.delete, photo.create, photo.update, photo.delete, photo.reorder, asset.register]
    entity_type:
      type: string
      enum: [trip, expense_category, trip_member, itinerary_item, ledger_entry, packing_item, todo, reservation, document, photo, asset]
    entity_id: {type: string, format: uuid, nullable: true}
    trip_id: {type: string, format: uuid, nullable: true}
    base:
      type: object
      nullable: true
      additionalProperties: false
      description: 创建与集合命令为null；其他只能提供version或operation_id其中之一。
      properties:
        version: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 19}
        operation_id: {type: string, format: uuid}
    guards:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [kind, scope_id]
        properties:
          kind: {type: string, enum: [categories, members, itinerary_day, packing_order, todo_order, photo_day]}
          scope_id: {type: string}
          revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
          operation_id: {type: string, format: uuid}
    depends_on:
      type: array
      maxItems: 100
      uniqueItems: true
      items: {type: string, format: uuid}
    payload:
      type: object
      additionalProperties: true
      description: 由封闭操作类型决定字段白名单，派生字段及未知字段拒绝。

SyncPushOutput:
  type: object
  additionalProperties: false
  x-go-type: syncmodel.PushOutput
  x-go-type-import:
    name: syncmodel
    path: tripfolio/server/internal/modules/sync
  required: [sync_epoch, results]
  properties:
    sync_epoch: {type: string, format: uuid}
    results:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [operation_id, status]
        properties:
          operation_id: {type: string, format: uuid}
          status: {type: string, enum: [applied, replayed, conflict, rejected, dependency_failed, failed]}
          result:
            type: object
            additionalProperties: false
            required: [references, scope_revisions, commit_cursor, warnings, data]
            properties:
              references:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [type, id, version]
                  properties:
                    type: {type: string}
                    id: {type: string, format: uuid}
                    version: {type: string, pattern: '^[1-9][0-9]*$', maxLength: 19}
              scope_revisions:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [kind, scope_id, revision]
                  properties:
                    kind: {type: string}
                    scope_id: {type: string}
                    revision: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
              commit_cursor: {type: string, nullable: true, description: 原提交标识，不可用作拉取游标；no-op为null。}
              warnings:
                type: array
                items: {type: string}
              data: {type: object, nullable: true, additionalProperties: true}
          error:
            type: object
            additionalProperties: false
            required: [code, http_status, retryable, detail]
            properties:
              code: {type: string}
              http_status: {type: integer}
              retryable: {type: boolean}
              detail: {type: string}
              conflict: {type: object, additionalProperties: true}
