PackingCategory:
  type: string
  description: 物资分类；取值清单见 Metadata.packing_categories
  enum: [documents, electronics, clothing, daily, food, medicine, other]

PackingStatus:
  type: string
  description: 物品状态；取值清单见 Metadata.packing_statuses
  enum: [pending, ready, packed]

PackingItem:
  type: object
  description: 行李清单物品的规范资源（接口设计 3.4）；同一结构也是同步日志与快照中的表示
  x-go-type: packing.Resource
  x-go-type-import:
    path: tripfolio/server/internal/modules/travel/packing
  required:
    [
      id,
      trip_id,
      name,
      category,
      quantity,
      notes,
      status,
      version,
      created_at,
      updated_at,
      deleted_at,
    ]
  properties:
    id:
      type: string
      format: uuid
    trip_id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 120
    category:
      $ref: '#/PackingCategory'
    quantity:
      type: integer
      format: int32
      minimum: 1
      maximum: 9999
    notes:
      type: string
      maxLength: 2000
    status:
      $ref: '#/PackingStatus'
    version:
      $ref: ./write.yaml#/Version
    created_at:
      $ref: ./write.yaml#/Instant
    updated_at:
      $ref: ./write.yaml#/Instant
    deleted_at:
      type: string
      format: date-time
      nullable: true

PackingItemResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/PackingItem'

PackingPage:
  type: object
  description: Page<PackingItem>；按 category、created_at、id 升序
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/PackingItem'
    next_cursor:
      type: string
      nullable: true

PackingCreate:
  type: object
  description: 创建独立物品；同一旅行内同分类同名（去首尾空格、大小写不敏感）的有效物品唯一
  required: [id, name, category]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 120
    category:
      $ref: '#/PackingCategory'
    quantity:
      type: integer
      format: int32
      minimum: 1
      maximum: 9999
      default: 1
    notes:
      type: string
      maxLength: 2000
    status:
      $ref: '#/PackingStatus'

PackingPatch:
  type: object
  description: 局部更新：缺省字段保持原值；改名同样受同分类同名唯一约束
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    category:
      $ref: '#/PackingCategory'
    quantity:
      type: integer
      format: int32
      minimum: 1
      maximum: 9999
    notes:
      type: string
      maxLength: 2000
    status:
      $ref: '#/PackingStatus'

PackingBatchItem:
  type: object
  description: 批量创建中的一件物品；状态固定为 pending
  required: [id, name, category]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 120
    category:
      $ref: '#/PackingCategory'
    quantity:
      type: integer
      format: int32
      minimum: 1
      maximum: 9999
      default: 1
    notes:
      type: string
      maxLength: 2000

PackingBatchCreate:
  type: object
  description: 一个事务批量创建 1–100 件物品；与既有有效物品或请求内重复的同分类同名项被跳过
  required: [items]
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: '#/PackingBatchItem'

PackingSkipped:
  type: object
  description: 被跳过的物品；reason=duplicate 表示同分类同名已存在或请求内重复
  required: [id, name, category, reason]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    category:
      $ref: '#/PackingCategory'
    reason:
      type: string
      enum: [duplicate]

PackingBatchResult:
  description: WriteResult（primary 与 data 为 null，affected 为已创建物品）加批量结果明细
  x-go-type: packing.BatchResult
  x-go-type-import:
    path: tripfolio/server/internal/modules/travel/packing
  allOf:
    - $ref: ./write.yaml#/WriteResult
    - type: object
      required: [created_ids, skipped]
      properties:
        created_ids:
          type: array
          items:
            type: string
            format: uuid
        skipped:
          type: array
          items:
            $ref: '#/PackingSkipped'

PackingBatchResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/PackingBatchResult'

PackingLibraryItem:
  type: object
  required: [name, quantity]
  properties:
    name:
      type: string
      maxLength: 120
    quantity:
      type: integer
      format: int32
      minimum: 1
      maximum: 9999

PackingLibraryCategory:
  type: object
  required: [category, name, items]
  properties:
    category:
      $ref: '#/PackingCategory'
    name:
      type: string
      description: 分类的中文名称，供直接展示
    items:
      type: array
      items:
        $ref: '#/PackingLibraryItem'

PackingLibrary:
  type: object
  description: 随程序发布的版本化内置物品库；不落库，version 变化时客户端可刷新缓存
  x-go-type: packing.Library
  x-go-type-import:
    path: tripfolio/server/internal/modules/travel/packing
  required: [version, categories]
  properties:
    version:
      type: string
      description: 物品库版本，与 Metadata.packing_library_version 一致
    categories:
      type: array
      items:
        $ref: '#/PackingLibraryCategory'

PackingLibraryResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/PackingLibrary'
