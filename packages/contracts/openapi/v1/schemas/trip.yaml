Trip:
  type: object
  description: 旅行的规范资源（接口设计 3.2）；同一结构也是同步日志与快照中的表示
  x-go-type: trip.Resource
  x-go-type-import:
    path: tripfolio/server/internal/modules/travel/trip
  required:
    [
      id,
      name,
      start_date,
      end_date,
      destination,
      notes,
      timezone,
      currency_code,
      budget_amount,
      version,
      created_at,
      updated_at,
      archived_at,
      currency_locked_at,
      deleted_at,
      purge_after_at,
      purge_requested_at,
    ]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 120
    start_date:
      $ref: ./write.yaml#/Date
    end_date:
      $ref: ./write.yaml#/Date
    destination:
      type: string
      maxLength: 300
    notes:
      type: string
      maxLength: 10000
    timezone:
      type: string
      maxLength: 64
      description: 本次旅行的唯一 IANA 时区，例如 Asia/Tokyo
    currency_code:
      $ref: ./common.yaml#/CurrencyCode
    budget_amount:
      type: string
      nullable: true
      description: 总预算；null 表示未设置，"0.00" 表示零预算；格式同 Money
      pattern: '^[0-9]{1,14}(\.[0-9]{1,4})?$'
    version:
      $ref: ./write.yaml#/Version
    created_at:
      $ref: ./write.yaml#/Instant
    updated_at:
      $ref: ./write.yaml#/Instant
    archived_at:
      type: string
      format: date-time
      nullable: true
      description: 归档时间；归档与旅行阶段独立
    currency_locked_at:
      type: string
      format: date-time
      nullable: true
      description: 存在有效账目时非空，此时币种不可改
    deleted_at:
      type: string
      format: date-time
      nullable: true
      description: 进入回收站的时间
    purge_after_at:
      type: string
      format: date-time
      nullable: true
      description: 回收站自动清理截止时间，在此之前可恢复
    purge_requested_at:
      type: string
      format: date-time
      nullable: true
      description: 已请求永久清理的时间，非空后不能再恢复

TripListItem:
  description: 列表项：Trip 加按旅行时区当天计算的阶段；列表不提供单资源 ETag
  x-go-type: trip.ListItem
  x-go-type-import:
    path: tripfolio/server/internal/modules/travel/trip
  allOf:
    - $ref: '#/Trip'
    - type: object
      required: [phase]
      properties:
        phase:
          type: string
          enum: [planned, ongoing, ended]
          description: planned 待出发 / ongoing 旅行中 / ended 已结束

TrashedTrip:
  description: 回收站中的旅行；按 purge_after_at 展示剩余保留时间，能否恢复以服务端判定为准
  x-go-type: trip.Resource
  x-go-type-import:
    path: tripfolio/server/internal/modules/travel/trip
  allOf:
    - $ref: '#/Trip'

TripResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/Trip'

TrashedTripResponse:
  type: object
  required: [data]
  properties:
    data:
      $ref: '#/TrashedTrip'

TripPage:
  type: object
  description: Page<TripListItem>；键集分页，游标绑定账号、筛选与排序
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TripListItem'
    next_cursor:
      type: string
      nullable: true
      description: 下一页游标；没有更多时为 null

TrashedTripPage:
  type: object
  description: Page<TrashedTrip>，按删除时间倒序
  required: [items, next_cursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TrashedTrip'
    next_cursor:
      type: string
      nullable: true

TripCreate:
  type: object
  description: 创建旅行；currency_code 默认 CNY，timezone 默认账号 default_timezone
  required: [id, name, start_date, end_date]
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      minLength: 1
      maxLength: 120
    start_date:
      $ref: ./write.yaml#/Date
    end_date:
      $ref: ./write.yaml#/Date
    destination:
      type: string
      maxLength: 300
    notes:
      type: string
      maxLength: 10000
    timezone:
      type: string
      maxLength: 64
    currency_code:
      $ref: ./common.yaml#/CurrencyCode
    budget_amount:
      type: string
      nullable: true
      pattern: '^[0-9]{1,14}(\.[0-9]{1,4})?$'
      description: 总预算，按币种小数位规范化；缺省或 null 表示未设置

TripPatch:
  type: object
  description: |
    局部更新：缺省字段保持原值；budget_amount 显式 null 表示清空。
    修改日期保留已有行程；修改 timezone 只改变当地时间的解释；
    修改 currency_code 需要旅行没有有效账目（否则 409 CURRENCY_LOCKED），
    且总预算与行程预计费用都为空（否则 409 CURRENCY_AMOUNTS_EXIST）。
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 120
    start_date:
      $ref: ./write.yaml#/Date
    end_date:
      $ref: ./write.yaml#/Date
    destination:
      type: string
      maxLength: 300
    notes:
      type: string
      maxLength: 10000
    timezone:
      type: string
      maxLength: 64
    currency_code:
      $ref: ./common.yaml#/CurrencyCode
    budget_amount:
      type: string
      nullable: true
      pattern: '^[0-9]{1,14}(\.[0-9]{1,4})?$'

ArchiveRequest:
  type: object
  required: [archived]
  properties:
    archived:
      type: boolean
      description: true 归档，false 取消归档；已处于目标状态时原样成功

PurgeTripRequest:
  type: object
  description: 永久清理回收站中的旅行；需要 If-Match、幂等键与本会话 5 分钟内的密码复验
  required: [confirm]
  properties:
    confirm:
      type: boolean
      description: 必须为 true，表示用户已确认不可恢复
