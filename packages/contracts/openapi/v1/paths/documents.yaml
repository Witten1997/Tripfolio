collection:
  parameters:
    - &id002
      name: trip_id
      in: path
      required: true
      schema: &id001
        type: string
        format: uuid
  get:
    tags:
      - travel
    operationId: listDocuments
    summary: created_at、id 均降序Document
    parameters:
      - name: reservation_id
        in: query
        required: false
        schema: *id001
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/DocumentPage
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/VersionRequired
      '503':
        $ref: ../openapi.yaml#/components/responses/DependencyUnavailable
  post:
    tags:
      - travel
    operationId: createDocument
    summary: 创建Document
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/DocumentCreate
    responses:
      '201':
        description: 成功
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/DocumentWriteResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/VersionRequired
      '503':
        $ref: ../openapi.yaml#/components/responses/DependencyUnavailable
item:
  parameters:
    - *id002
    - name: document_id
      in: path
      required: true
      schema: *id001
  get:
    tags:
      - travel
    operationId: getDocument
    summary: 读取Document
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/DocumentResponse
        headers:
          ETag:
            schema:
              type: string
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
