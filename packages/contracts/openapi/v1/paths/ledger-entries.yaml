collection:
  parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags: [finance]
    operationId: listLedgerEntries
    summary: 旅行的账目列表；按实际日期、分类、类型及关联筛选，键集分页
    parameters:
      - name: date_from
        in: query
        required: false
        description: 实际发生日期闭区间起点
        schema:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      - name: date_to
        in: query
        required: false
        description: 实际发生日期闭区间终点，须不早于 date_from
        schema:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
      - name: category_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: split_mode
        in: query
        required: false
        schema:
          $ref: ../schemas/ledger.yaml#/SplitMode
      - name: kind
        in: query
        required: false
        schema:
          $ref: ../openapi.yaml#/components/schemas/LedgerKind
      - name: has_refunds
        in: query
        required: false
        description: 按是否存在有效关联退款筛选原账单
        schema:
          type: boolean
      - name: refunded_entry_id
        in: query
        required: false
        description: 只返回关联到该原支出的退款
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: 一页账目，按 occurred_on、id 均降序
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LedgerPage
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
  post:
    tags: [finance]
    operationId: createLedgerEntry
    summary: 记录支出或退款；校验币种、分类有效与原支出关系，第一条有效账目锁定旅行币种
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LedgerCreate
    responses:
      '201':
        description: 已创建；币种首次锁定时旅行进入 affected
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WriteResponse
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '422':
        description: 校验失败（VALIDATION_FAILED）、币种与旅行不符（CURRENCY_MISMATCH）、退款超额（REFUND_AMOUNT_EXCEEDED）或分类/原支出/票据无效（INVALID_REFERENCE）
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem

item:
  parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entry_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags: [finance]
    operationId: getLedgerEntry
    summary: 单条账目，含票据资产 ID，不含临时下载地址
    responses:
      '200':
        description: 账目，带 ETag
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/LedgerEntryResponse
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
  patch:
    tags: [finance]
    operationId: updateLedgerEntry
    summary: 局部更新；类型不可改，修改金额与分类须与关联退款保持一致
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/LedgerPatch
    responses:
      '200':
        description: 已更新；修改原支出分类时其关联退款进入 affected；warnings 可能含 MERGED_WITH_NEWER_VERSION
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WriteResponse
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        description: 校验失败（VALIDATION_FAILED）、币种与旅行不符（CURRENCY_MISMATCH）、退款超额（REFUND_AMOUNT_EXCEEDED）或引用无效（INVALID_REFERENCE）
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem
      '428':
        $ref: ../openapi.yaml#/components/responses/VersionRequired
  delete:
    tags: [finance]
    operationId: deleteLedgerEntry
    summary: 软删除；删除原支出时同事务解除其关联退款并进入 affected（warnings 含 REFUNDS_UNLINKED），最后一条账目删除后解锁旅行币种
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
      - $ref: ../openapi.yaml#/components/parameters/IfMatch
    responses:
      '200':
        description: 已删除；data 为带 deleted_at 的账目
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WriteResponse
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/VersionRequired
