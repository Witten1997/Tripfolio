get:
  tags: [travel]
  operationId: getDashboard
  summary: 个人旅行看板，汇总已结束旅行的足迹、天数与分类花销
  description: 按旅行时区判断结束，按出发日期筛选。包含归档旅行，排除回收站。金额按旅行币种分别返回。
  parameters:
    - name: location_after
      in: query
      description: 使用上次返回的 next_location_after 继续识别坐标，不影响旅行与费用筛选
      schema:
        type: string
        maxLength: 64
    - name: date_from
      in: query
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
    - name: date_to
      in: query
      schema:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
  responses:
    '200':
      description: 同一数据库快照下的旅行统计；省市识别失败时明确返回待识别数量
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: ../openapi.yaml#/components/schemas/DashboardSnapshot
    '400':
      $ref: ../openapi.yaml#/components/responses/BadRequest
    '401':
      $ref: ../openapi.yaml#/components/responses/Unauthorized
    '422':
      $ref: ../openapi.yaml#/components/responses/ValidationFailed
    '503':
      $ref: ../openapi.yaml#/components/responses/DependencyUnavailable
