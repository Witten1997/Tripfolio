template:
  parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  get:
    tags: [finance]
    operationId: downloadLedgerImportTemplate
    summary: 下载包含当前账号分类及行程成员下拉列表的 Excel 账单模板
    responses:
      '200':
        description: 当前账号和行程专用的 .xlsx 模板
        content:
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
preview:
  parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    tags: [finance]
    operationId: previewLedgerImport
    summary: 上传 .xlsx 并预览账单、分摊结果和逐行错误，不写入账单
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: 最大 5 MB，账单填写在第 5–1004 行，最多 1000 笔
    responses:
      '200':
        description: 预览结果；有错误时不能确认导入，金额合计仅包含有效行
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  $ref: ../openapi.yaml#/components/schemas/LedgerImportPreview
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
commit:
  parameters:
    - name: trip_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    tags: [finance]
    operationId: commitLedgerImport
    summary: 确认已预览的 Excel，整批事务导入支出；同一批次重试不重复入账
    description: 集合保护开启时，提交预览返回的 members 基线和原 preview_digest，整批在同一事务中校验；保留原文件与基线重试。
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
      - $ref: ../openapi.yaml#/components/parameters/CollectionGuards
      - name: preview_digest
        in: query
        required: true
        schema:
          type: string
          pattern: '^[a-f0-9]{64}$'
        description: 预览返回的摘要；文件、分类或成员设置变化后必须重新预览
    requestBody:
      required: true
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
            description: 与预览相同的 .xlsx 文件，最大 5 MB
    responses:
      '201':
        description: 全部导入成功，affected 包含所有账单；结果不明时沿用同一 Idempotency-Key 重试
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/WriteResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/CollectionPreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/CollectionPreconditionRequired
