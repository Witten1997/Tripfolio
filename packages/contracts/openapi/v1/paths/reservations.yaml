collection:
  parameters:
    - &id001
      name: trip_id
      in: path
      required: true
      schema: &id002
        type: string
        format: uuid
  get:
    tags:
      - travel
    operationId: listReservations
    summary: start_local 升序、空值最后，再按 id 升序Reservation
    parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
            - transport
            - lodging
            - attraction
            - other
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ReservationPage
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/VersionRequired
      '503':
        $ref: ../openapi.yaml#/components/responses/DependencyUnavailable
  post:
    tags:
      - travel
    operationId: createReservation
    summary: 创建Reservation
    parameters:
      - $ref: ../openapi.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../openapi.yaml#/components/schemas/ReservationCreate
    responses:
      '201':
        description: 成功
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ReservationWriteResponse
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
      '409':
        $ref: ../openapi.yaml#/components/responses/Conflict
      '410':
        $ref: ../openapi.yaml#/components/responses/Gone
      '412':
        $ref: ../openapi.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
      '428':
        $ref: ../openapi.yaml#/components/responses/VersionRequired
      '503':
        $ref: ../openapi.yaml#/components/responses/DependencyUnavailable
item:
  parameters:
    - *id001
    - name: reservation_id
      in: path
      required: true
      schema: *id002
  get:
    tags:
      - travel
    operationId: getReservation
    summary: 读取Reservation
    responses:
      '200':
        description: 成功
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/ReservationResponse
        headers:
          ETag:
            schema:
              type: string
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '404':
        $ref: ../openapi.yaml#/components/responses/NotFound
