status:
  get:
    tags: [sync]
    operationId: getSyncStatus
    summary: 查询原生账号同步协议能力
    description: 未装配完整同步能力时返回 503。成功响应不包含拉取起点，必须先完成基线快照。
    responses:
      '200':
        description: 协议与保留边界配置
        content:
          application/json:
            schema:
              $ref: ../schemas/sync.yaml#/SyncStatus
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
      '503':
        description: 同步能力尚不可用
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem

changes:
  get:
    tags: [sync]
    operationId: getSyncChanges
    summary: 读取账号固定高水位的一页增量
    description: 不按旅行过滤；允许一页截断批次。末页 next_cursor 是下轮 checkpoint，commit_cursor 和本地 apply_cursor 不能用于此接口。
    parameters:
      - name: X-Tripfolio-Sync-Version
        in: header
        required: false
        description: 必须为 2；省略或不支持时由服务返回 426 SYNC_PROTOCOL_UNSUPPORTED。
        schema:
          type: string
      - name: cursor
        in: query
        required: true
        description: 完整基线或上一页签发的账号专属游标
        schema:
          type: string
          minLength: 1
          maxLength: 8192
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
    responses:
      '200':
        description: 有序事件和可持久化的扫描游标
        content:
          application/json:
            schema:
              $ref: ../schemas/sync.yaml#/SyncChangesPage
      '400':
        $ref: ../openapi.yaml#/components/responses/BadRequest
      '401':
        $ref: ../openapi.yaml#/components/responses/Unauthorized
      '403':
        $ref: ../openapi.yaml#/components/responses/Forbidden
      '409':
        description: SYNC_EPOCH_MISMATCH，需要新基线并隔离旧操作
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem
      '410':
        description: CURSOR_EXPIRED，历史不完整或超过保留边界
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem
      '422':
        $ref: ../openapi.yaml#/components/responses/ValidationFailed
      '426':
        description: SYNC_PROTOCOL_UNSUPPORTED
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem
      '500':
        $ref: ../openapi.yaml#/components/responses/InternalError
      '503':
        description: 同步能力或历史结构暂不可用，不得推进游标
        content:
          application/problem+json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/Problem
