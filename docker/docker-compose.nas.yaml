name: tripfolio

# NAS 离线部署用编排：只使用已导入的镜像，**不含 build**——NAS 上没有源码与 Node/Go 工具链。
# 镜像由 scripts/docker-image.sh 在开发机构建并导出，导入后按下面的步骤启动。
#
# 用法（NAS 上，与 .env 放在同一目录）：
#   sudo docker load -i tripfolio-app-<版本>.tar
#   cp .env.example .env && vi .env
#   sudo docker compose -f docker-compose.yaml up -d
#
# 依赖：已有的 PostgreSQL 与对象存储（阿里云 OSS）都在本编排之外，见 .env.example 与 README.md。

services:
  app:
    # 导出脚本会把这一行替换成具体版本，避免 NAS 上 latest 与导入的版本不一致
    image: tripfolio/app:latest
    container_name: tripfolio-app
    restart: unless-stopped
    env_file: [.env]
    environment:
      # 容器内端口固定，映射到 NAS 哪个端口由 TRIPFOLIO_HTTP_PORT 决定
      TRIPFOLIO_HTTP_ADDR: ':8080'
    ports:
      - '${TRIPFOLIO_HTTP_PORT:-8080}:8080'
    # 数据库/对象存储跑在 NAS 本机或另一个容器时用它访问；
    # 群晖部分版本不支持 host-gateway，此时把 .env 里的主机名直接写 NAS 的局域网 IP。
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
