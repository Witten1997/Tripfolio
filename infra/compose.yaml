name: tripfolio

services:
  postgres:
    image: postgres:18-alpine
    container_name: tripfolio-postgres
    environment:
      POSTGRES_USER: tripfolio
      POSTGRES_PASSWORD: tripfolio
      POSTGRES_DB: tripfolio
      # 中文排序与全文检索先不依赖 locale，保持 C 排序以获得稳定索引行为
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripfolio -d tripfolio']
      interval: 5s
      timeout: 3s
      retries: 20
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500ms

  minio:
    image: minio/minio:latest
    container_name: tripfolio-minio
    environment:
      MINIO_ROOT_USER: tripfolio
      MINIO_ROOT_PASSWORD: tripfolio-dev-secret
      # MinIO 不实现按桶 CORS（PutBucketCors 返回 NotImplemented），CORS 是服务端全局配置。
      # 这里按网页开发服务器与 Capacitor 来源收紧，默认值是 `*`。
      # 生产的 OSS 按桶在控制台配置：允许 PUT/GET/HEAD、暴露 ETag、来源为正式网页域。
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:5173,https://localhost'
    ports:
      # 9000 是 S3 API，9001 是控制台（http://localhost:9001，用上面的用户名密码登录）
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    command: ['server', '/data', '--console-address', ':9001']

  # 一次性初始化：建私有桶、配置直传 CORS、给暂存前缀加过期清理。
  # 跑完即退出，compose up 时用 --exit-code-from 之外的方式忽略其退出状态。
  minio-init:
    image: minio/mc:latest
    container_name: tripfolio-minio-init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ['/bin/sh', '/init.sh']
    environment:
      MINIO_ROOT_USER: tripfolio
      MINIO_ROOT_PASSWORD: tripfolio-dev-secret
      TRIPFOLIO_BUCKET: tripfolio

  # 单二进制容器：接口、内嵌页面与后台任务同进程运行（与生产同一形态），
  # 只是环境变量指向本机开发依赖。前端产物在镜像构建时嵌入。
  app:
    profiles: ['app']
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NPM_REGISTRY: ${TRIPFOLIO_BUILD_NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${TRIPFOLIO_BUILD_GOPROXY:-https://goproxy.cn,direct}
        VITE_AMAP_JS_KEY: ${VITE_AMAP_JS_KEY:-}
    image: tripfolio/app:local
    command: ['serve']
    environment:
      TRIPFOLIO_ENV: dev
      TRIPFOLIO_HTTP_ADDR: ':8080'
      TRIPFOLIO_DATABASE_URL: postgres://tripfolio:tripfolio@postgres:5432/tripfolio?sslmode=disable
      TRIPFOLIO_CORS_ORIGINS: http://localhost:5173,https://localhost
      TRIPFOLIO_WEB_BASE_URL: http://localhost:5173
      TRIPFOLIO_KEYRING: ${TRIPFOLIO_KEYRING:-}
      # 对象存储：容器内必须用 host.docker.internal 访问宿主机的 MinIO——写 localhost 会指向容器自己，
      # 服务端校验暂存对象时会连接失败。浏览器直传又要求端点能被浏览器解析，
      # 需要完整走通上传时设成本机局域网 IP：TRIPFOLIO_DEV_OBJECTSTORE_ENDPOINT=http://192.168.x.x:9000
      TRIPFOLIO_OBJECTSTORE_ENDPOINT: ${TRIPFOLIO_DEV_OBJECTSTORE_ENDPOINT:-http://host.docker.internal:9000}
      TRIPFOLIO_OBJECTSTORE_BUCKET: tripfolio
      TRIPFOLIO_OBJECTSTORE_ACCESS_KEY_ID: tripfolio
      TRIPFOLIO_OBJECTSTORE_SECRET_ACCESS_KEY: tripfolio-dev-secret
      TRIPFOLIO_OBJECTSTORE_USE_PATH_STYLE: 'true'
      # 两套高德凭证隔离：Web 服务 Key 给应用；JS 安全密钥由应用内置的 /_AMapService 代理解析。
      TRIPFOLIO_AMAP_WEB_SERVICE_KEY: ${TRIPFOLIO_AMAP_WEB_SERVICE_KEY:-}
      TRIPFOLIO_AMAP_JSCODE: ${AMAP_JSCODE:-}
      TRIPFOLIO_GEO_PER_ACCOUNT_PER_MINUTE: ${TRIPFOLIO_GEO_PER_ACCOUNT_PER_MINUTE:-60}
      TRIPFOLIO_GEO_GLOBAL_DAILY_LIMIT: ${TRIPFOLIO_GEO_GLOBAL_DAILY_LIMIT:-0}
      TRIPFOLIO_GEO_CACHE_TTL: ${TRIPFOLIO_GEO_CACHE_TTL:-24h}
      TRIPFOLIO_GEO_TIMEOUT: ${TRIPFOLIO_GEO_TIMEOUT:-5s}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # 容器内访问宿主机上的 MinIO；浏览器直传仍走宿主机端口
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '8080:8080'

volumes:
  postgres-data:
  minio-data:
